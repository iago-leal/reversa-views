# Adaptações declaradas sobre o código herdado.
#
# Cada item diz o que foi mudado na cópia em relação à origem, e é isso que o
# ressincronizador reaplica quando traz uma revisão nova. O trecho `original` é
# procurado por igualdade exata no conteúdo lido da origem e precisa ocorrer uma
# única vez; zero ou duas ocorrências interrompem a ressincronização inteira,
# sem escrever arquivo algum.
#
# Por isso o trecho precisa chegar com a indentação que tem no código. O bloco
# literal do YAML deduz a indentação pela primeira linha: quando ela começa por
# espaço, o bloco precisa do indicador (`|2`, contado a partir da chave), ou a
# indentação do código sai do texto lido. A conferência local, que roda no
# build, acusa o esquecimento como `adaptacao-nao-reaplica`.
#
# A prosa que explica a história de cada adaptação continua em
# `src/heranca/PROCEDENCIA.md`. Aqui vive o dado.
