# Manifesto da camada herdada.
#
# O QUE É. A fonte do dado de procedência: quais são as origens, em que revisão elas estavam
# quando a cópia foi feita, e qual o resumo criptográfico do conteúdo de cada arquivo herdado.
# O registro em prosa, com o porquê de cada escolha, vive em `src/heranca/PROCEDENCIA.md`, e as
# adaptações declaradas vivem em `src/heranca/adaptacoes.yml`. O ritual está no `README.md`.
#
# QUEM O ESCREVE. A lista de `arquivos` é escrita por ferramenta: quem a mantém é
# `npm run sync:heranca` e quem a confere é `npm run check:heranca`. Editá-la à mão é convite a
# erro, porque um resumo é uma linha de sessenta e quatro caracteres hexadecimais que ninguém
# confere de olho, e um resumo errado transforma o verificador em ruído: ou ele acusa o que está
# certo, ou deixa de acusar o que está errado. As origens acima da lista, essas sim, são escritas
# à mão, porque declaram decisão, e não observação.
#
# O QUE O RESUMO COBRE. O conteúdo herdado, isto é, o arquivo a partir da linha 8 nos que têm
# carimbo e o arquivo inteiro nos três fixtures que não podem tê-lo. Trocar o carimbo não conta
# como edição: carimbo é metadado, e ressincronizar o reescreve por definição.
#
# O QUE NÃO ENTRA AQUI. Caminho de máquina. Onde cada origem está clonada é assunto de
# `heranca.origens.yml`, que o git ignora, e cujo exemplo versionado fica ao lado dele.
versao: 1
origens:
  - nome: scrum-harness
    tipo: codigo
    endereco: https://github.com/iago-leal/scrum-harness
    revisao: 420305daa6cdd10858b720a34cb8db67d8e5c5e9
    dataDaRevisao: 2026-09-08
    dataDaCopia: 2026-09-09
    versaoDoReversaNaOrigem: 1.3.3
    chaveDoCaminhoLocal: scrum-harness
    prefixoNaOrigem: packages/
    sinaisDeDisparo:
      - anomalia de campo desconhecido no painel
      - versão nova do Reversa instalada
  - nome: vscode-kanban
    tipo: padrao
    endereco: https://github.com/iago-leal/vscode-kanban
    versaoObservada: 1.35.2
    dataDaObservacao: 2026-09-09
    chaveDoCaminhoLocal: vscode-kanban
    sinaisDeDisparo:
      - release nova da origem do kit
    nota: |
      Origem de padrão, não de arquivo. A lista de arquivos é vazia por definição, e não por
      pendência: da feature 003 veio desenho, e nenhum arquivo foi copiado. O arquivo mais próximo
      dela é `scripts/theme-tokens.js`, reescrito a partir do podador do kit e por isso não
      conferível por resumo.
    arquivos: []
arquivos:
